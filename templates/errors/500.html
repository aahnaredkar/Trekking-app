{% extends 'layouts/base.html' %}

{% block title %}500 Internal Error - Trekking Management System{% endblock %}

{% block content %}
<div class="row py-5 justify-content-center" style="min-height: 50vh;">
    <div class="col-md-6 col-lg-5 d-flex align-items-center">
        <div class="empty-state-card w-100" style="border: none;">
            <div class="empty-state-icon"><i class="bi bi-exclamation-diamond"></i></div>
            <h1 class="display-1 fw-bold text-brand-terracotta mb-2">500</h1>
            <h3 class="fw-bold text-brand-forest mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-brand"><i class="bi bi-house me-1"></i> Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
